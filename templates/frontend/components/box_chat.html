{# Sales chatbot popup #}
<div class="sales-chatbot-widget">
    <button
        type="button"
        class="sales-chatbot-toggle"
        id="sales-chatbot-toggle"
        aria-label="Mở chatbot"
    >
        <i class="fa fa-comments"></i>
    </button>

    <div
        class="sales-chatbot-panel"
        id="sales-chatbot-panel"
        style="display: none"
    >
        <div class="sales-chatbot-header">
            <div class="sales-chatbot-title">Trợ lý bán hàng</div>
            <button
                type="button"
                class="sales-chatbot-close"
                id="sales-chatbot-close"
                aria-label="Đóng"
            >
                &times;
            </button>
        </div>

        <div class="sales-chatbot-messages" id="sales-chatbot-messages"></div>

        <div class="sales-chatbot-input-wrap">
            <input
                type="text"
                id="sales-chatbot-input"
                placeholder="Nhập câu hỏi (ví dụ: top PC bán chạy)"
                autocomplete="off"
            />
            <button type="button" id="sales-chatbot-send">Gửi</button>
        </div>
    </div>
</div>

<style>
    .sales-chatbot-widget {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 10000;
    }

    .sales-chatbot-toggle {
        width: 58px;
        height: 58px;
        border-radius: 999px;
        border: none;
        background: #e53935;
        color: #fff;
        font-size: 22px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
        cursor: pointer;
    }

    .sales-chatbot-panel {
        width: min(92vw, 420px);
        height: min(78vh, 620px);
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
    }

    .sales-chatbot-header {
        background: #111827;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
    }

    .sales-chatbot-title {
        font-weight: 700;
        font-size: 14px;
    }

    .sales-chatbot-close {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
    }

    .sales-chatbot-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        background: #f8fafc;
    }

    .sales-chat-msg {
        margin-bottom: 10px;
        max-width: 92%;
    }

    .sales-chat-msg.user {
        margin-left: auto;
        text-align: right;
    }

    .sales-chat-msg.bot {
        margin-right: auto;
    }

    .sales-chat-bubble {
        display: inline-block;
        border-radius: 12px;
        padding: 9px 11px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .sales-chat-msg.user .sales-chat-bubble {
        background: #2563eb;
        color: #fff;
    }

    .sales-chat-msg.bot .sales-chat-bubble {
        background: #fff;
        color: #1f2937;
        border: 1px solid #e5e7eb;
    }

    .sales-chat-bubble p {
        margin: 0 0 8px;
        white-space: normal;
    }

    .sales-chat-bubble h1,
    .sales-chat-bubble h2,
    .sales-chat-bubble h3 {
        margin: 0 0 8px;
        line-height: 1.35;
        font-size: 14px;
        font-weight: 700;
    }

    .sales-chat-bubble p:last-child {
        margin-bottom: 0;
    }

    .sales-chat-bubble ul,
    .sales-chat-bubble ol {
        margin: 0 0 8px;
        padding-left: 18px;
    }

    .sales-chat-bubble li {
        margin: 2px 0;
        white-space: normal;
    }

    .sales-chat-bubble hr {
        border: 0;
        border-top: 1px solid #d1d5db;
        margin: 8px 0;
    }

    .sales-chat-bubble table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 8px;
        font-size: 12px;
        white-space: normal;
    }

    .sales-chat-bubble th,
    .sales-chat-bubble td {
        border: 1px solid #e5e7eb;
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
    }

    .sales-chat-bubble th {
        background: #f9fafb;
        font-weight: 700;
    }

    .sales-chat-bubble .sales-chat-task-item {
        list-style: none;
        margin-left: -18px;
    }

    .sales-chat-bubble .sales-chat-task-item input[type="checkbox"] {
        margin-right: 6px;
        transform: translateY(1px);
    }

    .sales-chat-bubble a {
        color: #2563eb;
        text-decoration: underline;
    }

    .sales-chat-bubble code {
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 1px 5px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
    }

    .sales-chat-bubble pre {
        margin: 0 0 8px;
        background: #111827;
        color: #f9fafb;
        border-radius: 10px;
        padding: 10px;
        overflow-x: auto;
        white-space: pre;
    }

    .sales-chat-bubble pre code {
        border: none;
        background: transparent;
        padding: 0;
        color: inherit;
    }

    .sales-chat-bubble blockquote {
        margin: 0 0 8px;
        padding-left: 10px;
        border-left: 3px solid #d1d5db;
        color: #4b5563;
    }

    .sales-chat-products {
        margin-top: 8px;
        display: grid;
        gap: 8px;
    }

    .sales-chat-product {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
        padding: 8px;
    }

    .sales-chat-product-title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .sales-chat-product-meta {
        font-size: 12px;
        color: #4b5563;
        margin-bottom: 6px;
    }

    .sales-chat-product a {
        font-size: 12px;
        font-weight: 600;
        color: #2563eb;
        text-decoration: none;
    }

    .sales-chatbot-input-wrap {
        display: flex;
        gap: 8px;
        border-top: 1px solid #e5e7eb;
        padding: 10px;
        background: #fff;
    }

    .sales-chatbot-input-wrap input {
        flex: 1;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 9px 10px;
        font-size: 13px;
    }

    .sales-chatbot-input-wrap button {
        border: none;
        border-radius: 10px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 600;
        background: #111827;
        color: #fff;
        cursor: pointer;
    }

    .sales-chatbot-input-wrap button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const isLoggedIn = {% if session.get('user_id') %}true{% else %}false{% endif %};

        const toggleBtn = document.getElementById('sales-chatbot-toggle');
        const panel = document.getElementById('sales-chatbot-panel');
        const closeBtn = document.getElementById('sales-chatbot-close');
        const messagesEl = document.getElementById('sales-chatbot-messages');
        const inputEl = document.getElementById('sales-chatbot-input');
        const sendBtn = document.getElementById('sales-chatbot-send');

        let isSending = false;
        let guestHistory = []; // only in-memory for guest, refresh will clear

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderInlineMarkdown(text) {
            let html = escapeHtml(text || '');
            html = html.replace(
                /\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
            );
            html = html.replace(
                /(^|[\s(])((https?:\/\/)[^\s<]+)/g,
                '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>'
            );
            html = html.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
            html = html.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?;:])/g, '$1<em>$2</em>');
            html = html.replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?;:])/g, '$1<em>$2</em>');
            html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
            return html;
        }

        function parseTableRow(line) {
            const trimmed = line.trim();
            let row = trimmed;
            if (row.startsWith('|')) {
                row = row.slice(1);
            }
            if (row.endsWith('|')) {
                row = row.slice(0, -1);
            }
            return row.split('|').map((cell) => cell.trim());
        }

        function isTableDelimiter(line) {
            if (!line || line.indexOf('|') === -1) {
                return false;
            }
            const cells = parseTableRow(line);
            if (cells.length === 0) {
                return false;
            }
            return cells.every((cell) => /^:?-{3,}:?$/.test(cell));
        }

        function renderMarkdown(text) {
            const source = String(text || '').replace(/\r\n/g, '\n');
            const fencedBlocks = [];
            let working = source.replace(/```([\w-]+)?\n([\s\S]*?)```/g, function (_, lang, code) {
                const language = (lang || '').trim();
                const codeHtml = `<pre><code${language ? ` class="language-${escapeHtml(language)}"` : ''}>${escapeHtml(code)}</code></pre>`;
                const token = `__FENCED_BLOCK_${fencedBlocks.length}__`;
                fencedBlocks.push(codeHtml);
                return token;
            });

            const lines = working.split('\n');
            const out = [];
            let inUl = false;
            let inOl = false;
            let inQuote = false;

            function closeUl() {
                if (inUl) {
                    out.push('</ul>');
                    inUl = false;
                }
            }

            function closeOl() {
                if (inOl) {
                    out.push('</ol>');
                    inOl = false;
                }
            }

            function closeQuote() {
                if (inQuote) {
                    out.push('</blockquote>');
                    inQuote = false;
                }
            }

            function closeAllBlocks() {
                closeUl();
                closeOl();
                closeQuote();
            }

            for (let i = 0; i < lines.length; i += 1) {
                const line = lines[i];
                const trimmed = line.trim();

                if (!trimmed) {
                    closeAllBlocks();
                    continue;
                }

                if (/^__FENCED_BLOCK_\d+__$/.test(trimmed)) {
                    closeAllBlocks();
                    out.push(trimmed);
                    continue;
                }

                if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
                    closeAllBlocks();
                    out.push('<hr>');
                    continue;
                }

                const headingMatch = /^(#{1,3})\s+(.+)$/.exec(trimmed);
                if (headingMatch) {
                    closeAllBlocks();
                    const level = headingMatch[1].length;
                    out.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
                    continue;
                }

                const nextLine = i + 1 < lines.length ? lines[i + 1].trim() : '';
                if (trimmed.indexOf('|') !== -1 && isTableDelimiter(nextLine)) {
                    closeAllBlocks();
                    const headers = parseTableRow(trimmed);
                    const bodyRows = [];
                    i += 2;
                    while (i < lines.length) {
                        const bodyLine = lines[i].trim();
                        if (!bodyLine || bodyLine.indexOf('|') === -1 || isTableDelimiter(bodyLine)) {
                            i -= 1;
                            break;
                        }
                        bodyRows.push(parseTableRow(bodyLine));
                        i += 1;
                    }

                    let tableHtml = '<table><thead><tr>';
                    headers.forEach((cell) => {
                        tableHtml += `<th>${renderInlineMarkdown(cell)}</th>`;
                    });
                    tableHtml += '</tr></thead><tbody>';
                    bodyRows.forEach((row) => {
                        tableHtml += '<tr>';
                        headers.forEach((_, idx) => {
                            tableHtml += `<td>${renderInlineMarkdown(row[idx] || '')}</td>`;
                        });
                        tableHtml += '</tr>';
                    });
                    tableHtml += '</tbody></table>';
                    out.push(tableHtml);
                    continue;
                }

                const ulMatch = /^[-*+]\s+(.+)$/.exec(trimmed);
                if (ulMatch) {
                    closeOl();
                    closeQuote();
                    if (!inUl) {
                        out.push('<ul>');
                        inUl = true;
                    }
                    const taskMatch = /^\[( |x|X)\]\s+(.+)$/.exec(ulMatch[1]);
                    if (taskMatch) {
                        const checked = taskMatch[1].toLowerCase() === 'x';
                        out.push(
                            `<li class="sales-chat-task-item"><label><input type="checkbox" disabled${checked ? ' checked' : ''}>${renderInlineMarkdown(taskMatch[2])}</label></li>`
                        );
                    } else {
                        out.push(`<li>${renderInlineMarkdown(ulMatch[1])}</li>`);
                    }
                    continue;
                }

                const olMatch = /^\d+\.\s+(.+)$/.exec(trimmed);
                if (olMatch) {
                    closeUl();
                    closeQuote();
                    if (!inOl) {
                        out.push('<ol>');
                        inOl = true;
                    }
                    out.push(`<li>${renderInlineMarkdown(olMatch[1])}</li>`);
                    continue;
                }

                const quoteMatch = /^>\s?(.+)$/.exec(trimmed);
                if (quoteMatch) {
                    closeUl();
                    closeOl();
                    if (!inQuote) {
                        out.push('<blockquote>');
                        inQuote = true;
                    }
                    out.push(`<p>${renderInlineMarkdown(quoteMatch[1])}</p>`);
                    continue;
                }

                closeAllBlocks();
                out.push(`<p>${renderInlineMarkdown(trimmed)}</p>`);
            }

            closeAllBlocks();

            let html = out.join('');
            fencedBlocks.forEach((block, idx) => {
                html = html.replace(`__FENCED_BLOCK_${idx}__`, block);
            });
            return html;
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function renderProducts(products) {
            if (!Array.isArray(products) || products.length === 0) {
                return '';
            }

            const html = products.map((item) => {
                const name = escapeHtml(item.name || 'Sản phẩm');
                const price = escapeHtml(item.formatted_price || 'Liên hệ');
                const link = escapeHtml(item.url || '#');
                const brand = escapeHtml(item.brand || 'N/A');
                const category = escapeHtml(item.category || 'N/A');
                return `
                    <div class="sales-chat-product">
                        <div class="sales-chat-product-title">${name}</div>
                        <div class="sales-chat-product-meta">Giá: ${price} | Hãng: ${brand} | Loại: ${category}</div>
                        <a href="${link}">Xem chi tiết sản phẩm</a>
                    </div>
                `;
            }).join('');

            return `<div class="sales-chat-products">${html}</div>`;
        }

        function renderMessageToBubble(bubble, text, products) {
            bubble.innerHTML = renderMarkdown(text || '') + renderProducts(products || []);
        }

        function addMessage(sender, text, products) {
            const wrap = document.createElement('div');
            wrap.className = `sales-chat-msg ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'sales-chat-bubble';

            renderMessageToBubble(bubble, text, products);
            wrap.appendChild(bubble);
            messagesEl.appendChild(wrap);
            scrollToBottom();
            return bubble;
        }

        async function loadHistory() {
            if (!isLoggedIn) {
                // Guest: clear everything on each refresh/page load by requirement
                try {
                    await fetch('/api/chat/reset-guest', { method: 'POST' });
                } catch (error) {
                    console.error('reset guest chat failed', error);
                }
                guestHistory = [];
                addMessage('bot', 'Xin chào. Mình là trợ lý bán hàng. Bạn có thể hỏi về sản phẩm, hãng, loại, so sánh PC hoặc thêm vào giỏ hàng.', []);
                return;
            }

            try {
                const response = await fetch('/api/get-chat-history/', { method: 'GET' });
                const data = await response.json();
                const history = data.chat_history || [];

                if (history.length === 0) {
                    addMessage('bot', 'Xin chào. Mình đã sẵn sàng hỗ trợ bán hàng và chăm sóc khách hàng cho bạn.', []);
                    return;
                }

                history.forEach((item) => {
                    const sender = item.sender === 'user' ? 'user' : 'bot';
                    addMessage(sender, item.text || '', item.sources || []);
                });
            } catch (error) {
                console.error(error);
                addMessage('bot', 'Không tải được lịch sử chat. Bạn có thể tiếp tục chat mới.', []);
            }
        }

        async function sendMessage() {
            const query = (inputEl.value || '').trim();
            if (!query || isSending) {
                return;
            }

            isSending = true;
            sendBtn.disabled = true;

            addMessage('user', query, []);
            inputEl.value = '';

            if (!isLoggedIn) {
                guestHistory.push({ sender: 'user', text: query });
            }

            try {
                const botBubble = addMessage('bot', '', []);
                let streamedText = '';
                let donePayload = null;

                const response = await fetch('/api/function-calling/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                if (!response.ok || !response.body) {
                    const fallback = await fetch('/api/function-calling/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query })
                    });
                    const fallbackData = await fallback.json();
                    if (!fallback.ok || !fallbackData.success) {
                        renderMessageToBubble(botBubble, fallbackData.message || 'Đã có lỗi xảy ra khi xử lý yêu cầu.', []);
                        return;
                    }
                    renderMessageToBubble(botBubble, fallbackData.response || '', fallbackData.products || []);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        break;
                    }
                    buffer += decoder.decode(value, { stream: true });
                    const chunks = buffer.split('\n\n');
                    buffer = chunks.pop() || '';

                    chunks.forEach((chunk) => {
                        const line = chunk.split('\n').find((row) => row.startsWith('data:'));
                        if (!line) {
                            return;
                        }
                        const jsonText = line.replace(/^data:\s*/, '');
                        let payload;
                        try {
                            payload = JSON.parse(jsonText);
                        } catch (e) {
                            return;
                        }

                        if (payload.type === 'delta') {
                            streamedText += payload.content || '';
                            renderMessageToBubble(botBubble, streamedText, []);
                            scrollToBottom();
                        } else if (payload.type === 'done') {
                            donePayload = payload;
                        }
                    });
                }

                if (!donePayload) {
                    renderMessageToBubble(botBubble, streamedText || 'Mình chưa có phản hồi phù hợp.', []);
                    return;
                }

                let botReply = donePayload.response || streamedText || 'Mình chưa có phản hồi phù hợp.';
                if (donePayload.requires_login && donePayload.login_url) {
                    botReply += `\nVui lòng đăng nhập tại: ${donePayload.login_url}`;
                }
                const products = donePayload.products || [];
                renderMessageToBubble(botBubble, botReply, products);

                if (!isLoggedIn) {
                    guestHistory.push({ sender: 'bot', text: botReply, products });
                }
            } catch (error) {
                console.error(error);
                addMessage('bot', 'Không thể kết nối máy chủ. Bạn thử lại sau ít phút.', []);
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        toggleBtn.addEventListener('click', function () {
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
            if (panel.style.display === 'flex') {
                scrollToBottom();
                inputEl.focus();
            }
        });

        closeBtn.addEventListener('click', function () {
            panel.style.display = 'none';
        });

        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        loadHistory().finally(function () {
            scrollToBottom();
        });
    });
</script>
